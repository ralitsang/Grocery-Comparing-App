    // --- ALGORITHMS ---
    function calculateStoreBasket(basketItems, storeId) {
      let totalSpendEUR = 0;
      let totalPromoSavingsEUR = 0;
      const itemsBreakdown = [];

      for (const item of basketItems) {
        const product = PRODUCTS.find(p => p.id === item.productId);
        if (!product) continue;

        const storePrice = product.prices[storeId];
        if (!storePrice) {
          itemsBreakdown.push({
            productId: product.id,
            productName: product.name,
            isMissing: true,
            spendEUR: 0,
            packsNeeded: 0,
            unitPriceEUR: 0,
            brand: 'Не е налично',
            isPromo: false
          });
          continue;
        }

        const requestedQty = Number(item.qty);
        const packQty = Number(storePrice.packQty);
        const packsNeeded = Math.max(1, Math.ceil(requestedQty / packQty));
        const spendEUR = Number((packsNeeded * storePrice.priceEUR).toFixed(2));
        const unitPriceEUR = Number((storePrice.priceEUR / packQty).toFixed(2));

        let promoSavingsEUR = 0;
        if (storePrice.isPromo) {
          const estimatedRegular = storePrice.priceEUR / 0.85;
          promoSavingsEUR = Number((packsNeeded * (estimatedRegular - storePrice.priceEUR)).toFixed(2));
          totalPromoSavingsEUR += promoSavingsEUR;
        }

        totalSpendEUR += spendEUR;

        itemsBreakdown.push({
          productId: product.id,
          productName: product.name,
          category: product.category,
          unit: product.unit,
          requestedQty,
          packsNeeded,
          packQty,
          packUnit: storePrice.packUnit,
          pricePerPackEUR: storePrice.priceEUR,
          spendEUR,
          unitPriceEUR,
          brand: storePrice.brand,
          isPromo: storePrice.isPromo,
          promoNote: storePrice.promoNote,
          promoSavingsEUR,
          isBDS: product.isBDS
        });
      }

      return {
        storeId,
        totalSpendEUR: Number(totalSpendEUR.toFixed(2)),
        totalPromoSavingsEUR: Number(totalPromoSavingsEUR.toFixed(2)),
        itemsCount: itemsBreakdown.length,
        itemsBreakdown
      };
    }

    function rankAllStores(basketItems) {
      if (!basketItems || basketItems.length === 0) {
        return {
          storeRankings: [],
          winner: null,
          mostExpensive: null,
          averageSpendEUR: 0,
          maxSavingsEUR: 0
        };
      }

      const storeRankings = STORES.map(store => {
        const basketResult = calculateStoreBasket(basketItems, store.id);
        return {
          ...store,
          ...basketResult
        };
      });

      storeRankings.sort((a, b) => a.totalSpendEUR - b.totalSpendEUR);

      const totalSum = storeRankings.reduce((acc, s) => acc + s.totalSpendEUR, 0);
      const averageSpendEUR = Number((totalSum / storeRankings.length).toFixed(2));
      const winner = storeRankings[0];
      const mostExpensive = storeRankings[storeRankings.length - 1];
      const maxSavingsEUR = Number((mostExpensive.totalSpendEUR - winner.totalSpendEUR).toFixed(2));

      return {
        storeRankings,
        winner,
        mostExpensive,
        averageSpendEUR,
        maxSavingsEUR
      };
    }

    function calculateSplitBasket(basketItems, singleStoreWinner, thresholdEUR = 3.0) {
      if (!basketItems || basketItems.length < 2 || !singleStoreWinner) {
        return null;
      }

      let bestSplit = null;
      let maxSavingsEUR = 0;

      for (let i = 0; i < STORES.length; i++) {
        for (let j = i + 1; j < STORES.length; j++) {
          const storeA = STORES[i];
          const storeB = STORES[j];

          let splitSpendEUR = 0;
          const storeAItems = [];
          const storeBItems = [];

          for (const item of basketItems) {
            const product = PRODUCTS.find(p => p.id === item.productId);
            if (!product) continue;

            const priceA = product.prices[storeA.id];
            const priceB = product.prices[storeB.id];

            const reqQty = Number(item.qty);
            const packsA = Math.max(1, Math.ceil(reqQty / (priceA ? priceA.packQty : 1)));
            const spendA = priceA ? Number((packsA * priceA.priceEUR).toFixed(2)) : Infinity;

            const packsB = Math.max(1, Math.ceil(reqQty / (priceB ? priceB.packQty : 1)));
            const spendB = priceB ? Number((packsB * priceB.priceEUR).toFixed(2)) : Infinity;

            if (spendA <= spendB) {
              splitSpendEUR += spendA;
              storeAItems.push({
                productName: product.name,
                brand: priceA.brand,
                spendEUR: spendA
              });
            } else {
              splitSpendEUR += spendB;
              storeBItems.push({
                productName: product.name,
                brand: priceB.brand,
                spendEUR: spendB
              });
            }
          }

          if (storeAItems.length > 0 && storeBItems.length > 0) {
            splitSpendEUR = Number(splitSpendEUR.toFixed(2));
            const savingsEUR = Number((singleStoreWinner.totalSpendEUR - splitSpendEUR).toFixed(2));

            if (savingsEUR > maxSavingsEUR) {
              maxSavingsEUR = savingsEUR;
              bestSplit = {
                storeA,
                storeB,
                storeAItems,
                storeBItems,
                splitSpendEUR,
                savingsEUR,
                isRecommended: savingsEUR >= thresholdEUR,
                thresholdEUR
              };
            }
          }
        }
      }

      return bestSplit;
    }

        </div>

        <!-- Main Workspace -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
          
          <!-- LEFT COLUMN: Search & Catalog (5 cols) -->
          <div class="lg:col-span-5 flex flex-col gap-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                  <span>🔍</span> Добави продукти
                </h2>
                <span class="text-xs text-slate-400">${filteredProducts.length} артикула</span>
              </div>

              <!-- Search Bar -->
              <div class="relative">
                <input
                  type="text"
                  value="${state.searchQuery}"
                  oninput="App.setSearch(this.value)"
                  placeholder="Търси продукт, марка (напр. прясно мляко, сирене, Верея)..."
                  class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition"
                />
                <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔎</span>
                ${state.searchQuery ? `
                  <button onclick="App.setSearch('')" class="absolute right-3 top-2 text-slate-400 hover:text-slate-600 text-xs">✕</button>
                ` : ''}
              </div>

              <!-- Categories -->
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${CATEGORIES.map(cat => `
                  <button
                    onclick="App.setCategory('${cat.id}')"
                    class="px-2.5 py-1 text-xs rounded-lg font-medium transition flex items-center gap-1 ${
                      state.selectedCategory === cat.id
                        ? 'bg-slate-900 text-white shadow-sm'
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                    }"
                  >
                    <span>${cat.icon}</span>
                    <span>${cat.name}</span>
                  </button>
                `).join('')}
              </div>

              <!-- Filters -->
              <div class="flex items-center gap-3 pt-1 text-xs text-slate-600 border-t border-slate-100">
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-slate-900">
                  <input
                    type="checkbox"
                    ${state.bdsOnly ? 'checked' : ''}
                    onchange="App.toggleBds(this.checked)"
                    class="rounded text-emerald-600 focus:ring-emerald-500"
                  />
                  <span class="font-medium text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">БДС Стандарт</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-slate-900">
                  <input
                    type="checkbox"
                    ${state.promoOnly ? 'checked' : ''}
                    onchange="App.togglePromo(this.checked)"
                    class="rounded text-red-600 focus:ring-red-500"
                  />
                  <span class="font-medium text-red-700 bg-red-50 px-1.5 py-0.5 rounded border border-red-200">🔥 Само промоции</span>
                </label>
              </div>
            </div>

            <!-- Product Cards List -->
            <div class="flex flex-col gap-2.5 max-h-[calc(100vh-320px)] overflow-y-auto pr-1">
              ${filteredProducts.map(p => {
                const prices = Object.values(p.prices);
                const minP = Math.min(...prices.map(pr => pr.priceEUR));
                const maxP = Math.max(...prices.map(pr => pr.priceEUR));
                const inBasket = state.basket.find(item => item.productId === p.id);
                const hasPromo = prices.some(pr => pr.isPromo);

                return `
                  <div class="bg-white rounded-xl p-3 border border-slate-200 hover:border-emerald-300 transition shadow-2xs flex items-center justify-between gap-3">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2">
                        <h3 class="text-sm font-bold text-slate-900 truncate">${p.name}</h3>
                        ${p.isBDS ? `<span class="text-[10px] bg-emerald-100 text-emerald-800 font-extrabold px-1 rounded uppercase">БДС</span>` : ''}
                        ${hasPromo ? `<span class="text-[10px] bg-red-100 text-red-700 font-extrabold px-1 rounded">АКЦИЯ</span>` : ''}
                      </div>
                      <p class="text-xs text-slate-500 line-clamp-1">${p.description}</p>
                      <div class="flex items-center gap-2 mt-1 text-xs">
                        <span class="font-semibold text-slate-800">€${minP.toFixed(2)} – €${maxP.toFixed(2)}</span>
                        <span class="text-slate-400">|</span>
                        <span class="text-slate-500">мерна единица: ${p.unit}</span>
                      </div>
                    </div>

                    <div>
                      ${inBasket ? `
                        <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg">
                          <button
                            onclick="App.updateQty('${p.id}', ${inBasket.qty - p.step})"
                            class="w-6 h-6 rounded bg-white hover:bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-xs border border-emerald-200"
                          >-</button>
                          <span class="text-xs font-bold text-emerald-800 w-8 text-center">${inBasket.qty}</span>
                          <button
                            onclick="App.updateQty('${p.id}', ${inBasket.qty + p.step})"
                            class="w-6 h-6 rounded bg-white hover:bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-xs border border-emerald-200"
                          >+</button>
                        </div>
                      ` : `
                        <button
                          onclick="App.addItem('${p.id}')"
                          class="px-3 py-1.5 bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-700 font-semibold text-xs rounded-lg transition border border-slate-200 hover:border-emerald-600 shadow-2xs"
                        >+ Добави</button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- RIGHT COLUMN: Results & Optimization (7 cols) -->
          <div class="lg:col-span-7 flex flex-col gap-5">
            
            <!-- Basket Bar -->
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-lg">🧺</span>
                  <h2 class="font-bold text-slate-800 text-base">Избрани продукти в кошницата</h2>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                    ${state.basket.length} вида
                  </span>
                </div>
                ${state.basket.length > 0 ? `
                  <button
                    onclick="App.copyShoppingList()"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold shadow-sm transition"
                  >
                    <span>📋</span> Копирай списък
                  </button>
                ` : ''}
              </div>

              ${state.basket.length === 0 ? `
                <div class="text-center py-8 text-slate-400">
                  <p class="text-3xl mb-2">🛒</p>
                  <p class="font-medium text-sm">Вашата кошница е празна.</p>
                  <p class="text-xs text-slate-400 mt-1">Добавете продукти от каталога вляво или изберете готова кошница от бутоните горе.</p>
                </div>
              ` : `
                <div class="flex flex-wrap gap-2 max-h-44 overflow-y-auto pr-1">
                  ${state.basket.map(item => {
                    const prod = PRODUCTS.find(p => p.id === item.productId);
                    if (!prod) return '';
                    return `
                      <div class="inline-flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1 text-xs">
                        <span class="font-medium text-slate-800">${prod.name}</span>
                        <span class="font-bold text-emerald-700 bg-emerald-50 px-1 rounded">${item.qty} ${prod.unit}</span>
                        <button onclick="App.removeItem('${item.productId}')" class="text-slate-400 hover:text-red-600 transition ml-1">✕</button>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- CHAMPION STORE CARD -->
            ${ranking.winner ? `
              <div class="bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-9xl opacity-10 pointer-events-none">🏆</div>
                
                <div class="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <div class="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider text-emerald-200 mb-2">
                      <span>🥇</span> Най-изгоден магазин за 1 спирка
                    </div>
                    <h3 class="text-2xl font-extrabold flex items-center gap-2">
                      <span>${ranking.winner.logo}</span>
                      <span>${ranking.winner.name}</span>
                    </h3>
                    <p class="text-xs text-emerald-100 mt-0.5">
                      ${ranking.winner.badge} • ${ranking.winner.description}
                    </p>
                  </div>

                  <div class="text-right">
                    <div class="text-xs uppercase tracking-wider text-emerald-200 font-semibold">Обща сметка</div>
                    <div class="text-3xl font-extrabold text-white tracking-tight">
                      €${ranking.winner.totalSpendEUR.toFixed(2)}
                    </div>
                    ${ranking.winner.totalPromoSavingsEUR > 0 ? `
                      <div class="text-xs text-emerald-200 font-medium">
                        🔥 Включва €${ranking.winner.totalPromoSavingsEUR.toFixed(2)} от промоции
                      </div>
                    ` : ''}
                  </div>
                </div>

                <!-- Savings Comparison Strip -->
                <div class="mt-4 pt-3 border-t border-white/15 grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                  <div class="bg-white/10 rounded-xl p-2.5 backdrop-blur-xs">
                    <div class="text-emerald-200 text-[11px]">Спрямо най-скъпия:</div>
                    <div class="font-extrabold text-base text-emerald-300">
                      +€${ranking.maxSavingsEUR.toFixed(2)} спестени
                    </div>
                    <div class="text-[10px] text-emerald-100/70">спрямо ${ranking.mostExpensive.name} (€${ranking.mostExpensive.totalSpendEUR.toFixed(2)})</div>
                  </div>
                  <div class="bg-white/10 rounded-xl p-2.5 backdrop-blur-xs">
                    <div class="text-emerald-200 text-[11px]">Средна цена за пазара:</div>
                    <div class="font-extrabold text-base text-white">
                      €${ranking.averageSpendEUR.toFixed(2)}
                    </div>
                    <div class="text-[10px] text-emerald-100/70">средно в София за този списък</div>
                  </div>
                  <div class="bg-white/10 rounded-xl p-2.5 backdrop-blur-xs col-span-2 sm:col-span-1">
                    <div class="text-emerald-200 text-[11px]">Пълнота на кошницата:</div>
                    <div class="font-extrabold text-base text-white">
                      100% наличност
                    </div>
                    <div class="text-[10px] text-emerald-100/70">Всички ${state.basket.length} артикула намерени</div>
                  </div>
                </div>
              </div>
            ` : ''}

            <!-- SPLIT-BASKET OPTIMIZER CARD -->
            ${split ? `
              <div class="rounded-2xl p-5 border shadow-sm transition ${
                split.isRecommended
                  ? 'bg-amber-50/80 border-amber-200 text-amber-950'
                  : 'bg-slate-100/80 border-slate-200 text-slate-700'
              }">
                <div class="flex items-center justify-between gap-3 mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-lg">${split.isRecommended ? '⚡' : 'ℹ️'}</span>
                    <h4 class="font-extrabold text-sm sm:text-base">
                      ${split.isRecommended
                        ? `Оптимизация на 2 магазина: Спестете още €${split.savingsEUR.toFixed(2)}!`
                        : 'Препоръка за разделяне на пазаруването'}
                    </h4>
                  </div>
                  <span class="text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider ${
                    split.isRecommended
                      ? 'bg-amber-200 text-amber-900 border border-amber-300'
                      : 'bg-slate-200 text-slate-600'
                  }">
                    ${split.isRecommended ? 'Препоръчва се' : 'Не се препоръчва'}
                  </span>
                </div>

                ${split.isRecommended ? `
                  <div>
                    <p class="text-xs text-amber-900/80 mb-3">
                      Ако комбинирате пазаруването между <strong>${split.storeA.name}</strong> и <strong>${split.storeB.name}</strong>, общата сметка пада до <strong>€${split.splitSpendEUR.toFixed(2)}</strong> (допълнително <strong>€${split.savingsEUR.toFixed(2)}</strong> под най-добрия единичен магазин!).
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      <div class="bg-white rounded-xl p-3 border border-amber-200 shadow-2xs">
                        <div class="font-bold text-slate-900 flex items-center gap-1.5 mb-1.5 pb-1 border-b border-slate-100">
                          <span>${split.storeA.logo}</span>
                          <span>В ${split.storeA.name} (${split.storeAItems.length} продукта):</span>
                        </div>
                        <ul class="space-y-1 text-slate-600 text-[11px]">
                          ${split.storeAItems.map(item => `
                            <li class="flex justify-between">
                              <span>• ${item.productName} (${item.brand})</span>
                              <strong class="text-slate-900 font-semibold">€${item.spendEUR.toFixed(2)}</strong>
                            </li>
                          `).join('')}
                        </ul>
                      </div>

                      <div class="bg-white rounded-xl p-3 border border-amber-200 shadow-2xs">
                        <div class="font-bold text-slate-900 flex items-center gap-1.5 mb-1.5 pb-1 border-b border-slate-100">
                          <span>${split.storeB.logo}</span>
                          <span>В ${split.storeB.name} (${split.storeBItems.length} продукта):</span>
                        </div>
                        <ul class="space-y-1 text-slate-600 text-[11px]">
                          ${split.storeBItems.map(item => `
                            <li class="flex justify-between">
                              <span>• ${item.productName} (${item.brand})</span>
                              <strong class="text-slate-900 font-semibold">€${item.spendEUR.toFixed(2)}</strong>
                            </li>
                          `).join('')}
                        </ul>
                      </div>
                    </div>
                  </div>
                ` : `
                  <p class="text-xs text-slate-600">
                    Разделянето между два магазина би спестило едва <strong>€${split.savingsEUR.toFixed(2)}</strong>, което е под вашия праг от <strong>€${state.splitThreshold.toFixed(2)}</strong>. По-изгодно и бързо е да направите цялото пазаруване на едно място в <strong>${ranking.winner.name}</strong>.
                  </p>
                `}
              </div>
            ` : ''}

            <!-- STORE RANKINGS ACCORDION -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col gap-4">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="font-extrabold text-slate-900 text-base">Сравнение по магазини</h3>
                  <p class="text-xs text-slate-500">Подредени от най-евтиния към най-скъпия за тази кошница</p>
                </div>
                <span class="text-xs font-semibold text-slate-500">Всички 5 вериги</span>
              </div>

              <div class="space-y-3">
                ${ranking.storeRankings.map((store, index) => {
                  const isWinner = index === 0;
                  const diffFromWinner = store.totalSpendEUR - ranking.winner.totalSpendEUR;
                  const isExpanded = state.expandedStoreId === store.id;

                  return `
                    <div class="rounded-xl border transition ${
                      isWinner
                        ? 'border-emerald-500 bg-emerald-50/20 shadow-2xs'
                        : 'border-slate-200 bg-white hover:border-slate-300'
                    }">
                      <!-- Store Header -->
                      <div
                        onclick="App.toggleStoreAccordion('${store.id}')"
                        class="p-3.5 flex items-center justify-between gap-3 cursor-pointer select-none"
                      >
                        <div class="flex items-center gap-3">
                          <span class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${
                            isWinner ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'
                          }">
                            #${index + 1}
                          </span>
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="text-base">${store.logo}</span>
                              <span class="font-extrabold text-slate-900 text-sm">${store.name}</span>
                              <span class="text-[11px] px-2 py-0.5 rounded font-medium bg-slate-100 text-slate-600">
                                ${store.badge}
                              </span>
                            </div>
                          </div>
                        </div>

                        <div class="flex items-center gap-4">
                          <div class="text-right">
                            <div class="text-base font-extrabold text-slate-900">
                              €${store.totalSpendEUR.toFixed(2)}
                            </div>
                            <div class="text-[11px] text-slate-500">
                              ${isWinner
                                ? `<strong class="text-emerald-700 font-bold">Най-ниска цена</strong>`
                                : `<span class="text-red-500 font-medium">+€${diffFromWinner.toFixed(2)}</span>`
                              }
                            </div>
                          </div>
                          <span class="text-slate-400 text-xs">${isExpanded ? '▲' : '▼'}</span>
                        </div>
                      </div>

                      <!-- Expanded Breakdown -->
                      ${isExpanded ? `
                        <div class="px-4 pb-4 pt-1 border-t border-slate-100 bg-slate-50/50 rounded-b-xl">
                          <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">
                            Разбивка на продуктите в ${store.name}:
                          </div>
                          <div class="space-y-1.5">
                            ${store.itemsBreakdown.map(item => `
                              <div class="flex items-center justify-between text-xs py-1 border-b border-slate-100 last:border-0">
                                <div>
                                  <div class="font-medium text-slate-800 flex items-center gap-1.5">
                                    <span>${item.productName}</span>
                                    ${item.isPromo ? `<span class="text-[10px] bg-red-100 text-red-700 px-1 rounded font-bold">${item.promoNote || 'Промо'}</span>` : ''}
                                    ${item.isBDS ? `<span class="text-[10px] bg-emerald-100 text-emerald-800 px-1 rounded font-bold">БДС</span>` : ''}
                                  </div>
                                  <div class="text-[11px] text-slate-500">
                                    Марка: <strong>${item.brand}</strong> • ${item.packsNeeded} бр. × €${item.pricePerPackEUR.toFixed(2)} (€${item.unitPriceEUR.toFixed(2)}/${item.packUnit})
                                  </div>
                                </div>
                                <div class="font-bold text-slate-900 text-right">
                                  €${item.spendEUR.toFixed(2)}
                                </div>
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

          </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
          <div class="max-w-7xl mx-auto px-4">
            <p class="font-semibold text-slate-700">Кошница.bg — Прототип за сравнение на цените на дребно в България (София)</p>
            <p class="mt-1">
              Всички валутни стойности са в <strong>EUR (€)</strong>. Сравнението включва собствени марки (Pilos, K-Classic, Extra Line, Clever) и национални марки по БДС стандарти.
            </p>
          </div>
        </footer>
      `;
    }

    // Immediate synchronous rendering on load
    document.addEventListener('DOMContentLoaded', render);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      render();
    }
  </script>
</body>
</html>
